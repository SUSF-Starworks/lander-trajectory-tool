[project]
name = "lander-trajectory-tool"
version = "0.1.0"
description = "Lander trajectory simulation GUI designed for the SUSF Starworks lander"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "nicegui[native]>=3.14.0",
    "pydantic>=2.13.4",
    "vtvl-sim @ git+https://github.com/dfps16/vtvl-sim.git@v0.3.0",
]

[project.scripts]
lander-trajectory-tool = "lander_trajectory_tool.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lander_trajectory_tool"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
  package = true
